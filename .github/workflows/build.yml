# .github/workflows/build.yml
name: Windows Production Build

on:
  push:
    branches:
      - main  # 当您 push 代码到 main 分支时自动触发打包

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. 部署 Python 运行沙盒
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 通过本地 requirements 统一版本控制，安装项目依赖
      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 执行 PyInstaller 编译程序
      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --add-data "core;core" --add-data "modules;modules" --add-data "auth.py;." main.py

      # 5. 调用 Windows 内置的 Inno Setup 编译器生成安装向导
      - name: Compile Installer using Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # 6. 将最终打包生成的安装包上传为 GitHub Artifact 供下载
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubgradeCompactionSystem_Windows_Installer
          path: SubgradeCompactionSystem_Setup.exe